name: Docker Image Build

on:
  push:
    branches: [ "Master" ]
  pull_request:
    branches: [ "Master" ]

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (optional but useful for build/test)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies and build app
      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build --if-present

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bank-app:${{ github.run_id }}

        
  kuber-update:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
            token: ${{ secrets.GITHUB_TOKEN }}

             name: Update Kubernetes manifest with new image
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/bank-app:${{ github.run_id }} "./ kubernetes/deployment.yaml
          cat k8s/deployment.yaml



          

